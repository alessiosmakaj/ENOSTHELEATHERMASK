<header class="page-header">
  <span class="page-header__eyebrow">Materia in movimento</span>
  <h1 class="page-header__title">Video</h1>
  <p class="page-header__lede">Il processo creativo e le opere raccontati in movimento.</p>
</header>

<section class="section video-section" *ngFor="let s of sections">
  <div class="container">
    <h2 class="video-section__title">{{ s.title }}</h2>

    <figure class="video-showcase" *ngIf="s.showcase">
      <video controls preload="metadata" playsinline>
        <source src="assets/enos.mp4" type="video/mp4" />
        Il tuo browser non supporta la riproduzione video.
      </video>
      <figcaption class="video-showcase__caption">ENOS — The Leather Mask</figcaption>
    </figure>

    <div class="card-grid">
      <article class="card card--soon" *ngFor="let p of [1, 2]">
        <div class="card__media">
          <svg viewBox="0 0 100 100" focusable="false" aria-hidden="true">
            <polygon points="40,30 40,70 72,50" fill="currentColor" />
            <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </div>
        <div class="card__body">
          <h3 class="card__title">Prossimamente</h3>
          <p class="card__desc">Nuovi contenuti video in arrivo.</p>
        </div>
      </article>
    </div>
  </div>
</section>
